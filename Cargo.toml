[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/playbook",
    "crates/detect",
    "apps/cli",
    "apps/desktop",
    "evals",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The dependency graph's own floor (darling, plist, time all declare 1.88), and
# `as_chunks` in crates/store needs it too. The previous value of 1.82 was
# aspirational — nothing enforced it and transitive deps had already moved past.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/that1guy15/salesHero"

[workspace.dependencies]
riposte-core = { path = "crates/core" }
riposte-store = { path = "crates/store" }
riposte-playbook = { path = "crates/playbook" }
riposte-detect = { path = "crates/detect" }
riposte-evals = { path = "evals" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
