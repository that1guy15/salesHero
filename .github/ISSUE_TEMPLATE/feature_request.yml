name: Scope change
description: Propose adding something to the product
labels: ["scope"]
body:
  - type: markdown
    attributes:
      value: >-
        `AGENTS.md`: *"Do not add features not in `docs/01-PRD.md` §3. Scope
        creep is the main failure mode for this kind of project."* Most
        proposals belong in §9 (Deferred) rather than in a build. That is not a
        rejection — it is where good ideas wait for evidence.
  - type: textarea
    id: problem
    attributes:
      label: What problem does the agent have
      description: >-
        Describe it from the producing agent's side of a live call, not as a
        feature. "Agents lose the callback time" beats "add a scheduler".
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer would this live in
      options:
        - "Layer 0 — rail, no dependencies"
        - "Layer 1 — detection"
        - "Layer 2 — LLM refinement"
        - "Console / settings"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Field observation, a support request, a measured number. A proposal with
        no evidence goes to `01-PRD.md` §9.
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I have read `docs/01-PRD.md` §3 and §9
          required: true
