name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # Everything except crates/audio compiles and tests on Linux, so the
    # default runner is cheap. Windows is where crates/audio must be proven
    # from M4 onward — see docs/PROJECT-STATUS.md §"Platform".
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # The ONNX path is the *real* gate (docs/DECISIONS.md D6); the default
      # embedder is a CI fixture. Without this the shipped gate is never
      # compiled in CI and rots silently. `check` rather than `test` so no
      # model weights are downloaded.
      - name: Check the ONNX gate compiles
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p riposte-detect --features onnx

      - name: Test
        run: cargo test --workspace

      # The four named invariant tests from AGENTS.md are required to exist.
      # A rename or deletion should fail CI loudly rather than quietly
      # reducing coverage of a legal constraint.
      - name: Required invariant tests are present
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # Collect once, then match in-shell. `cargo ... | grep -q` is a trap
          # under `pipefail`: grep -q exits on the first match, cargo dies of
          # SIGPIPE, and the pipeline reports failure — so a test that is
          # present reads as missing.
          list=$(cargo test --workspace -- --list 2>/dev/null || true)
          missing=0
          for t in comply_objections_never_reach_llm comply_wins_a_mixed_utterance; do
            case "$list" in
              *"$t"*) ;;
              *) echo "::error::required invariant test missing: $t"; missing=1 ;;
            esac
          done
          exit $missing

  smoke:
    # The M0 and M1 runnable criteria from docs/07-BUILD-PLAN.md, exercised
    # end to end. A milestone whose runnable output criterion is unmet does
    # not merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: M0 — import and list
        run: |
          cargo run -q -p riposte-cli -- playbook import playbooks/insurance-cold-call.yaml
          cargo run -q -p riposte-cli -- playbook list
          cargo run -q -p riposte-cli -- rail
      - name: M1 — detect
        run: |
          cargo run -q -p riposte-cli -- detect --text "yeah I never filled out any form" --all
          cargo run -q -p riposte-cli -- detect --text "take me off your list"

      # A removal request stated alongside another objection must never be
      # served a rebuttal. See docs/DECISIONS.md D11 — this regressed once and
      # the failure is silent, so it is asserted end to end and not only in a
      # unit test.
      # M1.5. Locks in the two M1 acceptance criteria that had no test, plus
      # the compliance gate: every removal request in the held-out probe set is
      # caught. Calibration measured 3 of 6 missed before the DNC vocabulary
      # was enumerated (docs/DECISIONS.md D16) — a silent regression there is a
      # TCPA exposure, not a quality dip.
      - name: Gate — M1 acceptance criteria and the compliance floor
        run: cargo run -q -p riposte-evals -- check

      - name: Compliance — a mixed utterance selects the comply card
        run: |
          out=$(cargo run -q -p riposte-cli -- detect --text "I already have insurance, quit calling")
          echo "$out"
          echo "$out" | grep -q comply || {
            echo "::error::a removal request was served a rebuttal"; exit 1; }
